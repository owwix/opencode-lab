name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.18.0"
          cache: npm

      - name: Require a signed annotated release tag
        run: node scripts/release/release-artifacts.mjs verify-tag --tag "$GITHUB_REF_NAME"

      - run: npm ci
      - run: npm run check
      - run: npm run release:test
      - run: npm run provenance:check
      - run: npm run compatibility:runtime

      - name: Build provenance-allowlisted source archive
        run: node scripts/release/release-artifacts.mjs bundle --version "$GITHUB_REF_NAME" --out dist

      - name: Generate source SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/opencode-lab-source.cdx.json
          artifact-name: opencode-lab-source-sbom
          upload-artifact: false
          upload-release-assets: false

      - name: Build gateway OCI image with SBOM and provenance
        run: >-
          docker buildx build
          --sbom=true
          --provenance=mode=max
          --output=type=oci,dest=dist/opencode-lab-agent-gateway.oci.tar
          docker/agent-gateway

      - name: Generate release checksums
        run: node scripts/release/release-artifacts.mjs checksums --out dist

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@00014ed6ed5efc5b1ab7f7f34a39eb55d41aa4f8 # v3.1.0
        with:
          subject-path: "dist/*"

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*
          --verify-tag
          --title "OpenCode Lab $GITHUB_REF_NAME"
          --notes-file "docs/release-notes/$GITHUB_REF_NAME.md"
