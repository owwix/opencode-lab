name: Supply chain

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "31 9 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.18.0"
          cache: npm

      - name: Install locked JavaScript dependencies
        run: npm ci

      - name: Verify provenance inventory
        run: npm run provenance:check

      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Scan dependency manifests with OSV
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --recursive
            ./

      - name: Build credential gateway scan target
        run: docker build --tag opencode-lab/agent-gateway:ci docker/agent-gateway

      - name: Generate container SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: opencode-lab/agent-gateway:ci
          format: cyclonedx-json
          artifact-name: opencode-lab-agent-gateway.cdx.json
          output-file: /tmp/opencode-lab-agent-gateway.cdx.json
          upload-artifact: true
          upload-artifact-retention: 14
          upload-release-assets: false

      - name: Scan credential gateway image
        uses: anchore/scan-action@0d444ed77d83ee2ba7f5ced0d90d640a1281d762 # v7.3.0
        with:
          image: opencode-lab/agent-gateway:ci
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-format: table
