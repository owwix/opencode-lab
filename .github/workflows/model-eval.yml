name: Metered Model Evaluation

on:
  workflow_dispatch:
    inputs:
      model:
        description: Workers AI model to evaluate
        required: true
        type: choice
        default: "@cf/moonshotai/kimi-k2.7-code"
        options:
          - "@cf/moonshotai/kimi-k2.7-code"
          - "@cf/moonshotai/kimi-k2.6"
          - "@cf/deepseek-ai/deepseek-v4-pro-0813"
          - "@cf/deepseek-ai/deepseek-v4-flash-0731"
          - "@cf/openai/gpt-oss-120b"
      trials:
        description: Independent trajectory trials per scenario
        required: true
        type: choice
        default: "3"
        options:
          - "1"
          - "3"
          - "5"

permissions:
  contents: read

concurrency:
  group: metered-model-eval
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OPENAI_BASE_URL: https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/ai/v1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          cache: npm

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.32
          enable-cache: true
          cache-dependency-glob: quality/inspect/uv.lock

      - name: Install locked dependencies
        run: |
          npm ci
          uv sync --project quality/inspect --locked --python 3.12

      - name: Run the fixed golden set
        run: npm run quality:eval -- --model 'openai/${{ inputs.model }}'

      - name: Run executable trajectory trials
        env:
          AGENT_QUALITY_TRIALS: ${{ inputs.trials }}
        run: >-
          npm run quality:eval:trajectory --
          --model 'openai/${{ inputs.model }}'

      - name: Retain evaluation logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: model-eval-${{ github.run_id }}
          path: quality/inspect/logs/
          if-no-files-found: error
          retention-days: 30
