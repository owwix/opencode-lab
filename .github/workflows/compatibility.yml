name: Compatibility

on:
  pull_request:
    paths:
      - "versions.lock"
      - "Dockerfile.opencode"
      - "docker-compose.opencode.yml"
      - "scripts/lab/compatibility.mjs"
      - "test/compatibility/**"
  push:
    branches: [main]
    paths:
      - "versions.lock"
      - "Dockerfile.opencode"
      - "docker-compose.opencode.yml"
      - "scripts/lab/compatibility.mjs"
      - "test/compatibility/**"
  schedule:
    - cron: "17 8 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.18.0"
          cache: npm

      - run: npm ci
      - run: npm run compatibility:check
      - run: npm run compatibility:runtime
