name: Agent Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.18.0"
  DAGGER_VERSION: "0.21.8"
  UV_VERSION: "0.11.32"

jobs:
  repository-contracts:
    name: Repository contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test quality controller contracts
        run: npm run quality:test

      - name: Test Hound relay contracts
        run: npm run test:hound

      - name: Lint source
        run: npm run lint

      - name: Check formatting
        run: npm exec -- oxfmt --check .

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  inspect-contracts:
    name: Inspect contracts (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: quality/inspect/uv.lock

      - name: Install locked evaluation dependencies
        run: uv sync --project quality/inspect --locked --python 3.12

      - name: Register Inspect tasks without calling a model
        run: >-
          uv run --project quality/inspect --locked
          inspect list tasks quality/inspect/evals/agent_quality.py

      - name: Test the golden-set contracts without calling a model
        run: >-
          uv run --project quality/inspect --locked
          python -m unittest discover -s quality/inspect/tests -p 'test_*.py'

  dagger-reproducibility:
    name: Dagger reproducibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Re-run controller tests in the pinned Dagger container
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}
          verb: run
          args: >-
            npm run quality:dagger --
            --workspace .
            --command "npm run quality:test"
            --output /tmp/agent-quality-evidence.json

      - name: Upload Dagger evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dagger-quality-evidence
          path: /tmp/agent-quality-evidence.json
          if-no-files-found: warn
          retention-days: 14
